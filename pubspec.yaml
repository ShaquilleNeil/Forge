name: forge
description: "Forge - private training app for powerlifters. Private side of the Forge/Rank pair."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (versions proven in DyadeSpace, FlutterFire BoM 5.1.0 set)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  cloud_functions: ^7.0.0 # deleteAccount callable (Nov 19)

  # Google sign-in + Google APIs (Sheets/Drive read for spreadsheet import)
  google_sign_in: ^7.2.0
  googleapis: ^14.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  # Media / files
  image_picker: ^1.1.2
  video_player: ^2.14.1
  file_picker: ^13.3.3
  csv: ^6.0.0

  # Permissions (11.x: permission_handler 13.x needs Android SDK 37)
  permission_handler: ^11.3.1

  # Coach side: QR pairing + code scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.1

  # Rest timer notifications: countdown in the notification shade and a
  # buzz + sound when rest is done, even with the phone locked.
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # UI / utils
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  fl_chart: ^1.1.0
  http: ^1.2.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  ffmpeg_kit_flutter_new_min: ^3.7.1
  live_activities: ^2.4.3
  flutter_foreground_task: ^11.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/google_g_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
